[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-uat-playbook"
version = "0.2.0"
description = "User acceptance testing (UAT) for AI agents: scenario acceptance criteria, test scripts, defect triage and go/no-go sign-off."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ravin Elango" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agent-uat = "agent_uat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_uat"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
