name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: Smoke test CLI on the synthetic example
        run: agent-uat validate --scenarios examples/support_agent_scenarios.json && agent-uat script --scenarios examples/support_agent_scenarios.json --out reports/script.md && agent-uat signoff --scenarios examples/support_agent_scenarios.json --results examples/support_agent_results.json --out reports/signoff.md
